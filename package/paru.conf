[options]
PgpFetch
Devel
Provides
BottomUp
SudoLoop
CombinedUpgrade
UpgradeMenu
NewsOnUpgrade
RemoveMake = ask
CleanAfter
FailFast
SortBy = popularity
Limit = 20

