# ═══════════════════════════════════════════════════════════════════════════
#  ACTIVE CONFIG — this is the Neobrix login screen. Nothing to run to apply it.
#
#  ReGreet (GTK4, themed by scripts/neobrix-generate-greeter) inside cage.
#  Takes effect at the next boot. Restarting greetd applies it sooner but ends
#  the running graphical session, so that is a console-only operation.
#
#  ── EMERGENCY ROLLBACK — only if the greeter fails to appear ──
#  /etc/greetd/RECOVERY, and nowhere else. No file in this directory contains a
#  runnable command in a comment: one did once, it got executed, and that is why
#  the greeter failed to come up after a reboot.
# ═══════════════════════════════════════════════════════════════════════════

[terminal]
vt = 1

[default_session]
# -m last: use a single output, not all of them. cage defaults to -m extend,
# which hands regreet one logical surface spanning every connected display —
# on a laptop with an external screen that is ~4500px wide, so regreet's
# centred card is centred on the *union* and lands at the seam between the two
# panels, with the session picker's popup opening somewhere unreadable. With
# -m last the greeter occupies one output and is centred on it.
#
# Which output that is comes from the order wlroots enumerates connectors, and
# cage offers no way to name one. If it picks the wrong screen, the fix is a
# greeter host that can select an output (sway with `output <name> disable`),
# not a cage flag.
command = "cage -m last -s -- regreet"
user = "greeter"
