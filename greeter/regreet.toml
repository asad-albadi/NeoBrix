# Generated by neobrix-generate-greeter (dusk). Do not edit by hand.

# Ask for the user every time. Neobrix has no autologin, so the greeter is the
# only authentication gate.
skip_selection = false

[background]
path = "/usr/share/backgrounds/neobrix/neobrix-dusk.png"
# Cover, not Contain: the wallpaper is generated at 2560x1440 and Contain would
# letterbox it on any other aspect ratio, showing bare GTK grey at the edges.
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = true
font_name = "JetBrainsMono Nerd Font 12"
icon_theme_name = "Papirus-Dark"
theme_name = "adw-gtk3-dark"

[appearance]
greeting_msg = "Neobrix"

[widget.clock]
format = "%H:%M"
resolution = "1s"
label_width = 180

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
