# Kitty — the terminal SUPER+RETURN opens.
#
# Palette kept identical to the alacritty config, which is still shipped for
# anyone who prefers it, so either terminal matches the shell without a second
# source of truth for the colours.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

window_padding_width    12
hide_window_decorations yes
background_opacity      1.0
confirm_os_window_close 0
scrollback_lines        20000
enable_audio_bell       no
cursor_shape            block
cursor_blink_interval   0.6

# fish, rather than whatever the account's login shell happens to be. Setting it
# here means every terminal window is fish without `chsh` touching the account —
# a login shell is the user's own decision, and one that goes wrong is awkward to
# undo from a desktop that has just changed underneath them.
shell                   fish

# Palette generated by `neobrix-theme`, which follows the shell's light/dark
# mode. Reload in place with: pkill -SIGUSR1 kitty
include neobrix-theme.conf
