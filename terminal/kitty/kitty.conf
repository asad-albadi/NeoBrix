# Kitty — the terminal SUPER+RETURN opens.
#
# Palette kept identical to the alacritty config, which is still shipped for
# anyone who prefers it, so either terminal matches the shell without a second
# source of truth for the colours.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

window_padding_width    12
hide_window_decorations yes
background_opacity      1.0
confirm_os_window_close 0
scrollback_lines        20000
enable_audio_bell       no
cursor_shape            block

# fish, rather than whatever the account's login shell happens to be. Setting it
# here means every terminal window is fish without `chsh` touching the account —
# a login shell is the user's own decision, and one that goes wrong is awkward to
# undo from a desktop that has just changed underneath them.
shell                   fish

# ── motion ──────────────────────────────────────────────────────────────────
# The cursor animates to its new position rather than jumping there, and that
# single option is the whole effect: typing streaks it along the line, RETURN
# sweeps it down and back to the left margin, and a paste drags it across
# everything that arrived at once.
#
# The value is a threshold in milliseconds, not a duration — the trail follows
# the cursor once it has settled for that long, which is what stops a fast
# redraw from smearing.
cursor_trail                 3

# Fastest and slowest decay, in seconds. Shorter than kitty's 0.1 0.4 default
# on purpose: the animations elsewhere in this desktop are deliberately brief,
# and a trail that lingers reads as a smear left behind rather than as movement.
cursor_trail_decay           0.05 0.25

# Cells the cursor must move before a trail is drawn, as (x, y). kitty defaults
# to 2, which skips single-character typing entirely — the case most worth
# smoothing. 1 animates every keystroke.
cursor_trail_start_threshold 1

# The trail takes the cursor's colour, which neobrix-theme sets per mode, so it
# is deliberately given none here.

# Switched rather than eased, and this one is not a style preference. Easing the
# blink animates it, so kitty repaints continuously for as long as a window is
# open: measured on an idle window running nothing, `0.6 ease-in-out` cost 2.00%
# of a core and 107 wakeups/s, against 0.00% and 0.7/s for a plain blink. That
# is per window, forever, to animate a cursor nobody is looking at.
cursor_blink_interval        0.6

# None of the above is smooth if the frames are not. sync_to_monitor lands them
# on the refresh, so raising the paint rate costs nothing on a 60Hz panel and
# fills a 144Hz one.
sync_to_monitor              yes
repaint_delay                8

# enable_audio_bell is no above, which left no bell at all. A brief flash in its
# place; the colour is unset so it follows the palette.
visual_bell_duration         0.08 linear

# Palette generated by `neobrix-theme`, which follows the shell's light/dark
# mode. Reload in place with: pkill -SIGUSR1 kitty
include neobrix-theme.conf
