# ─────────────────────────────────────────────────────────────────────────────
#  Neobrix lock screen.
#
#  Same design language as the shell: flat cards, chunky outlines, hard offset
#  shadows, bold mono type.
#
#  The palette is NOT hardcoded here. hyprlock is a separate process with its own
#  hyprlang config and cannot read Theme.qml, so `neobrix-theme` generates
#  hyprlock-palette.conf from the same palette the shell uses and this file
#  sources it — which is what makes the lock screen follow light/dark.
#
#  The fallbacks below are the dawn values, used only if the generated file is
#  missing (a fresh checkout that has never run neobrix-theme). hyprlang takes
#  the last assignment, so sourcing afterwards overrides them.
# ─────────────────────────────────────────────────────────────────────────────

$ink       = rgb(171210)
$cream     = rgb(fcf6ee)
$creamAlt  = rgb(f0e2d2)
$deep      = rgb(e3d3c1)
$fg        = rgb(1e1815)
$peach     = rgb(f6a97e)
$pistachio = rgb(afdca0)
$error     = rgb(e8776b)
$dim       = rgb(8a7a6c)
$scrim     = rgba(f0e2d259)
$font      = JetBrainsMono Nerd Font

source = ~/.config/hypr/hyprlock-palette.conf

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = brix, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, brix
    animation = fadeOut, 1, 3, brix
    animation = inputFieldDots, 1, 2, brix
}

background {
    monitor =
    # A normalised copy of the current wallpaper, refreshed by `neobrix-wallpaper`.
    # `path = screenshot` is avoided deliberately: it needs a screencopy DRM buffer,
    # which a virtio-gpu guest denies, and hyprlock exits when that fails.
    path = ~/.local/state/neobrix/lock-background.png
    # Neo-brutalism is flat and high contrast. Two blur passes turned the
    # geometric wallpapers into a smooth gradient — exactly the frosted-glass
    # look this design rejects. One light pass keeps card text legible over a
    # busy image while the blocks stay readable as blocks; the flat $scrim
    # below does the rest of the contrast work.
    blur_passes = 1
    blur_size = 2
    noise = 0.008
    contrast = 1.05
    brightness = 0.96
    vibrancy = 0.0
}

# ── scrim ────────────────────────────────────────────────────────────────────
# Flat full-screen wash that lifts the cards off the wallpaper. Generated per
# palette by neobrix-theme: a cream wash in dawn, a near-black one in dusk.
shape {
    monitor =
    size = 100%, 100%
    color = $scrim
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ── time card ────────────────────────────────────────────────────────────────
# The shadow slab is drawn as a separate shape offset down-right, exactly like
# BrixCard in the shell.
shape {
    monitor =
    size = 420, 150
    color = $ink
    rounding = 16
    border_size = 0
    position = 6, 194
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 420, 150
    color = $cream
    rounding = 16
    border_size = 3
    border_color = $ink
    position = 0, 200
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +'%-I:%M'
    color = $ink
    font_size = 66
    font_family = $font ExtraBold
    position = 0, 222
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] date +'%p  ·  %A, %-d %B'
    color = $dim
    font_size = 13
    font_family = $font Bold
    position = 0, 166
    halign = center
    valign = center
    zindex = 3
}

# ── user card ────────────────────────────────────────────────────────────────
shape {
    monitor =
    size = 320, 62
    color = $ink
    rounding = 14
    border_size = 0
    position = 6, 60
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 320, 62
    color = $creamAlt
    rounding = 14
    border_size = 3
    border_color = $ink
    position = 0, 66
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text =    $USER
    color = $ink
    font_size = 16
    font_family = $font ExtraBold
    position = 0, 66
    halign = center
    valign = center
    zindex = 3
}

# ── password field ───────────────────────────────────────────────────────────
# hyprlock paints the input field last, so it gets its own chunky outline rather
# than a separate shadow shape (a shape would end up drawn over the field).
input-field {
    monitor =
    size = 320, 52
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outer_color = $ink
    inner_color = $cream
    font_color = $fg
    font_family = JetBrainsMono Nerd Font Bold
    rounding = 12

    check_color = $peach
    fail_color = $error
    fail_text = <b>$FAIL</b>  ·  attempt $ATTEMPTS
    capslock_color = $peach
    # numlock_color / bothlock_color are deliberately not set: Hyprland enables
    # numlock by default, and overriding those with -1 makes hyprlock draw the
    # outline in an unset colour — i.e. no visible border at all.
    invert_numlock = false
    swap_font_color = false

    placeholder_text = <span foreground="##8a7a6c"><b>enter password</b></span>
    hide_input = false
    # Default is true, which fades the whole field out while the buffer is empty —
    # i.e. the password box is invisible until you start typing. A brutalist lock
    # screen should show you exactly where to type.
    fade_on_empty = false
    fade_timeout = 0
}

# ── status strip ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] printf '%s' "$(hostname)  ·  $(uptime -p | sed 's/^up //')"
    color = $creamAlt
    font_size = 11
    font_family = $font Bold
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = NEOBRIX
    color = $peach
    font_size = 12
    font_family = $font ExtraBold
    position = 24, -24
    halign = left
    valign = top
    zindex = 3
}
