# ─────────────────────────────────────────────────────────────────────────────
#  Neobrix lock screen.
#
#  Same design language as the shell: flat cards, chunky outlines, hard offset
#  shadows, bold mono type.
#
#  The palette is NOT hardcoded here. hyprlock is a separate process with its own
#  hyprlang config and cannot read Theme.qml, so `neobrix-theme` generates
#  hyprlock-palette.conf from the same palette the shell uses and this file
#  sources it — which is what makes the lock screen follow light/dark.
#
#  The fallbacks below are the dawn values, used only if the generated file is
#  missing (a fresh checkout that has never run neobrix-theme). hyprlang takes
#  the last assignment, so sourcing afterwards overrides them.
# ─────────────────────────────────────────────────────────────────────────────

$ink       = rgb(171210)
$cream     = rgb(fcf6ee)
$creamAlt  = rgb(f0e2d2)
$deep      = rgb(e3d3c1)
$fg        = rgb(1e1815)
$peach     = rgb(f6a97e)
$pistachio = rgb(afdca0)
$error     = rgb(e8776b)
$dim       = rgb(8a7a6c)
$scrim     = rgba(f0e2d259)
$font      = JetBrainsMono Nerd Font

source = ~/.config/hypr/hyprlock-palette.conf
# $gpu, resolved once by neobrix-theme. lspci costs about 1.8s on a cold cache,
# which the lock screen used to pay for on every lock — the hardware card filled
# in a beat after it appeared.
source = ~/.config/hypr/hyprlock-sysinfo.conf

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = brix, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, brix
    animation = fadeOut, 1, 3, brix
    animation = inputFieldDots, 1, 2, brix
}

background {
    monitor =
    # A normalised copy of the current wallpaper, refreshed by `neobrix-wallpaper`.
    # `path = screenshot` is avoided deliberately: it needs a screencopy DRM buffer,
    # which a virtio-gpu guest denies, and hyprlock exits when that fails.
    path = ~/.local/state/neobrix/lock-background.png
    # Neo-brutalism is flat and high contrast. Two blur passes turned the
    # geometric wallpapers into a smooth gradient — exactly the frosted-glass
    # look this design rejects. One light pass keeps card text legible over a
    # busy image while the blocks stay readable as blocks; the flat $scrim
    # below does the rest of the contrast work.
    blur_passes = 1
    blur_size = 2
    noise = 0.008
    contrast = 1.05
    brightness = 0.96
    vibrancy = 0.0
}

# ── scrim ────────────────────────────────────────────────────────────────────
# Flat full-screen wash that lifts the cards off the wallpaper. Generated per
# palette by neobrix-theme: a cream wash in dawn, a near-black one in dusk.
shape {
    monitor =
    size = 100%, 100%
    color = $scrim
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ── time card ────────────────────────────────────────────────────────────────
# The shadow slab is drawn as a separate shape offset down-right, exactly like
# BrixCard in the shell.
shape {
    monitor =
    size = 420, 150
    color = $ink
    rounding = 16
    border_size = 0
    position = 6, 194
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 420, 150
    color = $cream
    rounding = 16
    border_size = 3
    border_color = $ink
    position = 0, 200
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +'%-I:%M'
    # $fg, not $ink: the outline is near-black in both palettes now, so text
    # coloured from it disappears on a dark card.
    color = $fg
    font_size = 66
    font_family = $font ExtraBold
    position = 0, 222
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] date +'%p  ·  %A, %-d %B'
    color = $dim
    font_size = 13
    font_family = $font Bold
    position = 0, 166
    halign = center
    valign = center
    zindex = 3
}

# ── user card ────────────────────────────────────────────────────────────────
shape {
    monitor =
    size = 320, 62
    color = $ink
    rounding = 14
    border_size = 0
    position = 6, 60
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 320, 62
    color = $creamAlt
    rounding = 14
    border_size = 3
    border_color = $ink
    position = 0, 66
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    # The account's real name, not the login name. hyprlock has $DESC for GECOS,
    # but it renders empty where nobody set one — this falls back to the login
    # name instead, and matches SysInfo.displayName so the lock screen and the
    # control centre agree about what to call you.
    text = cmd[] n=$(getent passwd $(id -un) | cut -d: -f5 | cut -d, -f1); printf '%s' "${n:-$(id -un)}"
    color = $fg
    font_size = 16
    font_family = $font ExtraBold
    position = 0, 66
    halign = center
    valign = center
    zindex = 3
}

# ── password field ───────────────────────────────────────────────────────────
# hyprlock paints the input field last, so it gets its own chunky outline rather
# than a separate shadow shape (a shape would end up drawn over the field).
input-field {
    monitor =
    size = 320, 52
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 3
    # The reference for how Neobrix masks a password everywhere: a solid round
    # dot with a gap about a third of its diameter. The greeter and the Wi-Fi
    # passphrase field render dots as glyphs, so they reach the same proportion
    # with letter-spacing instead — change one, change all three.
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outer_color = $ink
    inner_color = $cream
    font_color = $fg
    font_family = JetBrainsMono Nerd Font Bold
    rounding = 12

    check_color = $peach
    fail_color = $error
    fail_text = <b>$FAIL</b>  ·  attempt $ATTEMPTS
    capslock_color = $peach
    # numlock_color / bothlock_color are deliberately not set: Hyprland enables
    # numlock by default, and overriding those with -1 makes hyprlock draw the
    # outline in an unset colour — i.e. no visible border at all.
    invert_numlock = false
    swap_font_color = false

    placeholder_text = <span foreground="##8a7a6c"><b>enter password</b></span>
    hide_input = false
    # Default is true, which fades the whole field out while the buffer is empty —
    # i.e. the password box is invisible until you start typing. A brutalist lock
    # screen should show you exactly where to type.
    fade_on_empty = false
    fade_timeout = 0
}

# ── status strip ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] printf '%s' "$(id -un)@$(hostname)  ·  $(uptime -p | sed 's/^up //')"
    color = $dim
    font_size = 11
    font_family = $font Bold
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 3
}

# ── status cards, top right ──────────────────────────────────────────────────
# Two cards, not one: the battery changes while you look at it and the hardware
# never does, so they are different kinds of thing and are drawn as such.
#
# Cards rather than bare labels, which is what these were first. Text straight
# onto the background washed out in dawn and collided with whatever wallpaper
# block happened to sit behind it; everything else here that carries information
# sits on a filled card with the chunky border and hard offset shadow.

shape {
    monitor =
    # The status label is a single line in hyprlock (no clipping or wrapping
    # control), so give it a real text measure rather than letting a long
    # charging estimate spill past the card edge.
    size = 224, 52
    color = $ink
    rounding = 16
    border_size = 0
    position = -18, -30
    halign = right
    valign = top
    zindex = 1
}

shape {
    monitor =
    size = 224, 52
    color = $creamAlt
    rounding = 16
    border_size = 3
    border_color = $ink
    position = -24, -24
    halign = right
    valign = top
    zindex = 2
}

label {
    monitor =
    # Absent entirely on a machine with no battery — the guard exits 0 with no
    # output and hyprlock draws nothing rather than "0%% · unknown".
    #
    # power_now reads 0 whenever the battery is neither charging nor discharging,
    # which is the normal state of a plugged-in laptop and would divide by zero.
    # Each branch checks before dividing and says something true instead. The
    # compact suffix keeps the useful exact estimate inside the fixed card.
    text = cmd[update:30000] b=/sys/class/power_supply/BAT0; [ -r $b/capacity ] || exit 0; p=$(cat $b/capacity); s=$(cat $b/status); e=$(cat $b/energy_now 2>/dev/null || echo 0); w=$(cat $b/power_now 2>/dev/null || echo 0); f=$(cat $b/energy_full 2>/dev/null || echo 0); case $s in Charging) g=󰂅; if [ "$w" -gt 0 ]; then m=$(( (f-e)*60/w )); d="$((m/60))h $((m%60))m full"; else d="charging"; fi ;; Discharging) g=󰁿; if [ "$w" -gt 0 ]; then m=$(( e*60/w )); d="$((m/60))h $((m%60))m left"; else d="on battery"; fi ;; *) g=󰁹; d="plugged in" ;; esac; printf '%s %s%% · %s' "$g" "$p" "$d"
    color = $fg
    font_size = 10
    font_family = $font ExtraBold
    position = -42, -39
    halign = right
    valign = top
    zindex = 3
}

shape {
    monitor =
    size = 268, 116
    color = $ink
    rounding = 16
    border_size = 0
    position = -18, -98
    halign = right
    valign = top
    zindex = 1
}

shape {
    monitor =
    size = 268, 116
    color = $creamAlt
    rounding = 16
    border_size = 3
    border_color = $ink
    position = -24, -92
    halign = right
    valign = top
    zindex = 2
}

label {
    monitor =
    # DMI, which is free text: it repeats the board code ("FX516PC_FX516PC") and
    # is a placeholder on plenty of machines. Falls back to the hostname, which
    # is also a machine name and is always there, so the line is never blank.
    text = cmd[] n=$(cat /sys/class/dmi/id/product_name 2>/dev/null | sed 's/_.*//'); case $n in ""|"To Be Filled"*|"System Product"*|"Default string"*) n=$(hostname) ;; esac; printf '%s' "$n"
    color = $fg
    font_size = 11
    font_family = $font ExtraBold
    position = -42, -106
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    text = cmd[] printf '%s' "$(. /etc/os-release; printf '%s' "${PRETTY_NAME:-$NAME}")  ·  $(uname -r)"
    color = $dim
    font_size = 10
    font_family = $font
    position = -42, -130
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    # Vendors put (R), (TM), the word CPU, a generation and a nominal clock in the
    # model string. The clock is the worst of them: it reads as a current
    # frequency and is not one.
    text = cmd[] c=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1 | sed 's/(R)//g; s/(TM)//g; s/ CPU//; s/@.*//; s/^[0-9]*th Gen //; s/Intel //; s/AMD //; s/  */ /g; s/ *$//'); r=$(awk '/MemTotal/{printf "%.0f", $2/1048576}' /proc/meminfo); printf '%s  ·  %s GiB' "$c" "$r"
    color = $dim
    font_size = 10
    font_family = $font
    position = -42, -152
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    text = $gpu
    color = $dim
    font_size = 10
    font_family = $font
    position = -42, -174
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    text = NEOBRIX
    color = $peach
    font_size = 12
    font_family = $font ExtraBold
    position = 24, -24
    halign = left
    valign = top
    zindex = 3
}
