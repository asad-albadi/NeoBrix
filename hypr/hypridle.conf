# Idle behaviour.
#
# Tuned for a development machine: the screen dims and eventually locks, but the
# system is never suspended automatically and nothing happens in the first ten
# minutes. Suspend is left as a deliberate action (session menu / lid switch on
# real hardware) rather than something that interrupts a long build.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = neobrix-idle light
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 10 min — dim the backlight (no-op where there is no backlight device).
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 15 min — lock.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 20 min — turn the outputs off. Waking is instant and loses nothing.
# `dpms off` blanks the output but leaves the backlight powered, which is most
# of what a dark screen should save — measured, it saved nothing at all. Both
# steps live in neobrix-idle so the panel actually goes dark.
listener {
    timeout = 1200
    on-timeout = neobrix-idle dark
    on-resume = neobrix-idle light
}

# Nothing above this ever suspends, so an idle laptop held ~17 W until the
# battery was flat. Battery only: neobrix-idle refuses to suspend a machine on
# mains, and one with no battery at all is a desktop and is left alone.
listener {
    timeout = 1800
    on-timeout = neobrix-idle suspend
}

# Deliberately no suspend listener. Add one in a local override if you want it:
#
#   listener {
#       timeout = 3600
#       on-timeout = systemctl suspend
#   }
